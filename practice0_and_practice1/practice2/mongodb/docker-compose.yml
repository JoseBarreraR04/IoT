services:
  mongodb:
    image: mongo:latest
    container_name: mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password123
    volumes:
      - mongodb_data:/data/db

  python_app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: python_app
    volumes:
      - ./test_mongodb:/app
    working_dir: /app
    # Comando para mantener el contenedor encendido indefinidamente
    command: tail -f /dev/null
    depends_on:
      - mongodb

volumes:
  mongodb_data:
